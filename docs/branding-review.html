<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalahNest brand review</title>
<style>
@font-face{font-family:Sora;src:url("../fonts/sora-latin-var.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{font-family:Sora,"Aptos",Arial,sans-serif;color:#173234;background:#f5f2e9;font-synthesis:none}
*{box-sizing:border-box}
body{margin:0;padding:36px;display:grid;gap:36px;background:#f5f2e9}
.artboard{width:1200px;overflow:hidden;border-radius:28px;display:flex;align-items:center;position:relative}
#logo-preview{height:720px;padding:76px;background:#f8f6ef;gap:82px}
.logo-tile{width:400px;height:400px;border-radius:100px;background:#0d1616;display:grid;place-items:center;box-shadow:0 28px 56px rgba(13,22,22,.16);flex:none}
.logo-tile img{width:330px;height:330px;object-fit:contain}
.logo-copy{max-width:520px}
.wordmark{font-size:68px;font-weight:650;letter-spacing:-4px;color:#143b3d;line-height:1.05}
.descriptor{font-size:21px;letter-spacing:.02em;color:#677978;margin-top:18px}
.palette{display:flex;gap:12px;margin-top:52px}
.swatch{width:56px;height:56px;border-radius:16px;border:1px solid rgba(25,56,56,.09)}
.swatch.teal{background:#0d1616}.swatch.ivory{background:#f8f0dc}.swatch.gold{background:#d5ae63}.swatch.sage{background:#6b8d86}
#social-preview{height:630px;padding:90px 105px;border-radius:0;background:linear-gradient(125deg,#0d1616 0%,#102b2d 54%,#173b3c 100%);color:#f8f0dc;gap:72px}
#social-preview:before{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(213,174,99,.13);border-radius:50%;left:0;top:54px;transform:translateX(-38%)}
.social-mark{width:330px;height:330px;display:grid;place-items:center;flex:none;position:relative}
.social-mark img{width:100%;height:100%;object-fit:contain}
.social-copy{position:relative;z-index:1}
.social-title{font-size:76px;font-weight:650;letter-spacing:-4px;line-height:1.05;color:#f8f0dc}
.social-subtitle{font-size:25px;color:#d3bf92;margin-top:24px;letter-spacing:.02em}
.social-rule{width:74px;height:3px;border-radius:3px;background:#d5ae63;margin-top:38px}
</style>
</head>
<body>
<main>
<section class="artboard" id="logo-preview" aria-label="Logo preview">
  <div class="logo-tile"><img src="../assets/salahnest-mark.png" alt="SalahNest mihrab, crescent, and dawn mark"></div>
  <div class="logo-copy">
    <div class="wordmark">SalahNest</div>
    <div class="descriptor">Prayer times · Quran · Qibla</div>
    <div class="palette" aria-label="Brand palette">
      <span class="swatch teal"></span><span class="swatch ivory"></span><span class="swatch gold"></span><span class="swatch sage"></span>
    </div>
  </div>
</section>
<section class="artboard" id="social-preview" aria-label="Social preview">
  <div class="social-mark"><img src="../assets/salahnest-mark.png" alt=""></div>
  <div class="social-copy">
    <div class="social-title">SalahNest</div>
    <div class="social-subtitle">Prayer times · Quran · Qibla</div>
    <div class="social-rule"></div>
  </div>
</section>
</main>
</body>
</html>
