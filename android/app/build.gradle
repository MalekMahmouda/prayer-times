apply plugin: 'com.android.application'

android {
    namespace = "com.malek.prayertimes"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.malek.prayertimes"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 8
        versionName "1.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // signingConfig is assigned right after the signingConfigs block
            // below (declaration order matters in the Groovy DSL).
        }
    }

    // v1.4.0: the release config ALWAYS references a signingConfig; when the
    // properties file is missing (fresh clone), a placeholder config is
    // registered whose storeFile check fails assembleRelease with a clear
    // message — instead of silently producing an unsigned APK.
    signingConfigs {
        release {
            def ksPropsFile = rootProject.file("../keystore/prayertimes.properties")
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksPropsFile.withInputStream { ksProps.load(it) }
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            } else {
                // Placeholder values; the verify task below fails the build.
                storeFile file('../keystore/MISSING-keystore.jks')
                storePassword 'missing'
                keyAlias 'missing'
                keyPassword 'missing'
            }
        }
    }
    buildTypes.release.signingConfig = signingConfigs.release
}

// Guard: verify the keystore exists before any release build runs.
tasks.register('verifyReleaseKeystore') {
    doFirst {
        def ksPropsFile = rootProject.file("../keystore/prayertimes.properties")
        if (!ksPropsFile.exists()) {
            throw new GradleException(
                "Release keystore missing: keystore/prayertimes.properties not found.\n" +
                "assembleRelease would produce an UNSIGNED APK. Create the keystore (see docs/ANDROID.md) " +
                "or run 'gradlew assembleDebug' for testing.")
        }
    }
}
tasks.matching { it.name in ['validateSigningRelease', 'packageRelease', 'assembleRelease'] }.configureEach {
    dependsOn 'verifyReleaseKeystore'
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
