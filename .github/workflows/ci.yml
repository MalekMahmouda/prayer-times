name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Scheduler tests
        run: node scripts/test-scheduler.js
      - name: Contract tests
        run: node scripts/test-contract.js
      - name: npm audit (production deps only)
        run: npm audit --omit=dev
